name: mcp_flutter_workspace
publish_to: none
environment:
  sdk: ">=3.12.0 <4.0.0"

# Until universal_automation_interface 0.4.0 is on pub.dev, pin UA packages at a
# reviewed git ref (tool/ci/universal_automation_ref.txt). Overrides apply to the
# whole workspace without gitignored path checkouts.
dependency_overrides:
  universal_automation_interface:
    git:
      url: https://github.com/Arenukvern/universal_automation_ai_device_use.git
      path: pkgs/universal_automation_interface
      ref: 1c6f7982a1764ea090860d23aff284c5df073159
  universal_automation_semantics:
    git:
      url: https://github.com/Arenukvern/universal_automation_ai_device_use.git
      path: pkgs/universal_automation_semantics
      ref: 1c6f7982a1764ea090860d23aff284c5df073159

workspace:
  - packages/*
  - mcp_toolkit
  - mcp_server_dart
  - jaspr_web_example
  - showcase/drivers
