name: flutter_mcp_harness
description: >-
  Programmatic E2E harness for Flutter apps: build and launch a debug binary,
  attach to its Dart VM service, drive widgets through the MCP toolkit service
  extensions, and assert with composable scenarios.
version: 7.0.2
license: MIT
repository: https://github.com/Arenukvern/mcp_flutter/tree/main/packages/harness
issue_tracker: https://github.com/Arenukvern/mcp_flutter/issues
documentation: https://github.com/Arenukvern/mcp_flutter/tree/main/packages/harness#readme
topics:
  - flutter
  - testing
  - e2e
  - mcp
  - automation
resolution: workspace
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  intentcall_core: ^1.1.0
  intentcall_schema: ^1.0.0
  flutter_mcp_toolkit_core: ^7.0.2
  path: ^1.9.0
  universal_automation_interface: ^0.4.0
  universal_browser_cdp: ^0.5.0
  vm_service: ^15.3.0
dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
  # Hosted 0.3.1 still declares interface ^0.3.0; main already targets ^0.4.0.
  # Pin git until pub.dev ships conformance with the interface 0.4 train floor.
  universal_automation_conformance:
    git:
      url: https://github.com/Arenukvern/universal_automation_ai_device_use.git
      path: pkgs/universal_automation_conformance
      ref: a3be2da0ec99eeaa8eab3d05fc6db16b2c7bb984
