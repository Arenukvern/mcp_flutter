name: flutter_mcp_harness
description: >-
  Programmatic E2E harness for Flutter apps: build and launch a debug binary,
  attach to its Dart VM service, drive widgets through the MCP toolkit
  service extensions, and assert with composable scenarios.
version: 0.2.0
license: MIT
repository: https://github.com/Arenukvern/mcp_flutter/tree/main/packages/harness
issue_tracker: https://github.com/Arenukvern/mcp_flutter/issues
documentation: https://github.com/Arenukvern/mcp_flutter/tree/main/packages/harness#readme
topics:
  - flutter
  - testing
  - e2e
  - mcp
  - automation

resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  # flutter_mcp_harness is a PUBLISHED package: hosted consumers (oka)
  # resolve these on pub.dev, so the floor is pinned to the train that
  # carries the projection API (1.0.0). In-repo proof consumers stay
  # version-free (docs/intentcall/README.md); the gate exempts this file.
  intentcall_core: ^1.0.0
  intentcall_schema: ^1.0.0
  flutter_mcp_toolkit_core: ^5.1.0
  path: ^1.9.0
  universal_automation_interface: ^0.2.0
  universal_browser_cdp: ^0.2.0
  vm_service: ^15.3.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
  universal_automation_conformance: ^0.2.0
