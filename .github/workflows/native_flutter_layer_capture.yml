name: Native flutter_layer capture

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    name: Android emulator flutter_layer proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Checkout IntentCall (flutter_demo path overrides)
        uses: actions/checkout@v4
        with:
          repository: Arenukvern/intentcall
          path: intentcall
          persist-credentials: false

      - name: Enable Linux desktop (host dependency sanity)
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -gpu swiftshader_indirect -no-window
          script: bash tool/native_capture/ci_android_flutter_layer.sh

      - name: Upload Android native capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-capture-android
          path: .native_capture/android/
          if-no-files-found: warn

  linux-desktop:
    name: Linux desktop flutter_layer proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Checkout IntentCall (flutter_demo path overrides)
        uses: actions/checkout@v4
        with:
          repository: Arenukvern/intentcall
          path: intentcall
          persist-credentials: false

      - name: Linux toolchain deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev mesa-utils libgl1 g++ libstdc++-12-dev xvfb

      - name: Run Linux flutter_layer matrix
        env:
          LIBRARY_PATH: /usr/lib/gcc/x86_64-linux-gnu/12:/usr/lib/gcc/x86_64-linux-gnu/13
          LDFLAGS: -L/usr/lib/gcc/x86_64-linux-gnu/12 -L/usr/lib/gcc/x86_64-linux-gnu/13
        run: bash tool/native_capture/ci_linux_flutter_layer.sh

      - name: Upload Linux native capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-capture-linux
          path: .native_capture/linux/
          if-no-files-found: warn
