name: Native flutter_layer capture

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    name: Android emulator flutter_layer proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Checkout IntentCall (flutter_test_app path overrides)
        uses: actions/checkout@v4
        with:
          repository: Arenukvern/intentcall
          path: intentcall
          persist-credentials: false

      - name: Workspace pub get
        run: flutter pub get

      - name: Install oka CLI
        run: dart pub global activate oka

      - name: Enable PATH for global packages
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -gpu swiftshader_indirect -no-window
          script: |
            export RUN_NATIVE_FLUTTER_LAYER_ANDROID=1
            export NATIVE_CAPTURE_ARTIFACT_DIR="$GITHUB_WORKSPACE/.native_capture/android"
            mkdir -p "$NATIVE_CAPTURE_ARTIFACT_DIR"
            cd packages/harness
            dart test -t native-android --concurrency=1 \
              test/integration/native_flutter_layer_capture_test.dart

      - name: Upload Android native capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-capture-android
          path: .native_capture/android/
          if-no-files-found: warn

  linux-desktop:
    name: Linux desktop flutter_layer proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Linux toolchain deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev mesa-utils libgl1 g++ libstdc++-12-dev xvfb

      - name: Checkout IntentCall (flutter_test_app path overrides)
        uses: actions/checkout@v4
        with:
          repository: Arenukvern/intentcall
          path: intentcall
          persist-credentials: false

      - name: Workspace pub get
        run: flutter pub get

      - name: Run Linux flutter_layer integration (Dart owner)
        env:
          LIBRARY_PATH: /usr/lib/gcc/x86_64-linux-gnu/12:/usr/lib/gcc/x86_64-linux-gnu/13
          LDFLAGS: -L/usr/lib/gcc/x86_64-linux-gnu/12 -L/usr/lib/gcc/x86_64-linux-gnu/13
          RUN_NATIVE_FLUTTER_LAYER_LINUX: '1'
          NATIVE_CAPTURE_ARTIFACT_DIR: ${{ github.workspace }}/.native_capture/linux
        run: |
          mkdir -p "$NATIVE_CAPTURE_ARTIFACT_DIR"
          cd packages/harness
          xvfb-run -a dart test -t native-linux --concurrency=1 \
            test/integration/native_flutter_layer_capture_test.dart

      - name: Upload Linux native capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-capture-linux
          path: .native_capture/linux/
          if-no-files-found: warn
