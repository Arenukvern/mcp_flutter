# dart_changesets per-tag publish leg. pub.dev's automated publishing is
# ref-gated, so each run publishes exactly the package its tag names; the
# dart_changesets action dispatches one run per tag when the version PR merges.
# Replaces pub_publish.yml (root v* tag consolidated publisher).
#
# Dependency-order convergence is owned by the ENGINE: publish-tag waits up
# to 15 minutes (dependency-wait-minutes input on the reusable workflow) for
# same-train floors to land on pub.dev, with per-poll progress logs. No local
# waiter job — the engine behavior applies to every consumer uniformly.
name: dart_changesets publish

on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. mcp_toolkit-v7.2.3'
        required: true
        type: string
      execute:
        description: 'Publish for real (unchecked = preflight)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dart-changesets-publish-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: Arenukvern/dart_changesets/.github/workflows/publish.yml@v1
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      # inputs.execute is the caller's TYPED boolean; github.event.inputs
      # carries the string form, which the reusable's boolean input rejects
      # ('Unexpected value true' at scheduling).
      execute: ${{ github.event_name == 'push' || inputs.execute }}
      flutter-version: '3.50.1'
    secrets: inherit
    # pub.dev OIDC automated publishing: only this job may mint a token
    # (job permissions replace the workflow-level grant).
    permissions:
      contents: read
      id-token: write

  binaries:
    needs: publish
    # Preflight (execute=false) validates the publish path only — building and
    # re-uploading release assets would just hit the full-conflict guard.
    if: >-
      startsWith(github.event.inputs.tag || github.ref_name, 'flutter_mcp_toolkit_server-v') &&
      (github.event_name == 'push' || inputs.execute == true)
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit
    # The called release workflow creates the root v* tag and the GitHub
    # release; a nested workflow cannot exceed the caller's grant, so the
    # call must grant contents: write (workflow-level stays read).
    permissions:
      contents: write
