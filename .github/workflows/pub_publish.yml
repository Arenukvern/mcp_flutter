name: Publish pub.dev packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      execute_publish:
        description: >-
          Publish to pub.dev with skip-existing (run from a v* tag ref after a
          partial failure or to finish the train without re-uploading packages).
        type: boolean
        default: false
      trigger_mcp_registry:
        description: >-
          After a successful publish step, run publish_mcp_registry.yml on this ref
          (use when the tag push run failed after pub.dev upload).
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: pub-dev-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - uses: dart-lang/setup-dart@v1

      - name: Require v* tag for publish
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.execute_publish)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Publish requires a v* tag ref (got $GITHUB_REF). In workflow_dispatch, select the tag (e.g. v7.1.0)."
            exit 1
          fi

      - name: Assert release tag matches VERSION
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.execute_publish)
        run: bash tool/release/assert_release_tag.sh "${{ github.ref_name }}"

      - name: Release preflight
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.execute_publish)
        run: bash tool/release/publish_pub_packages.sh

      - name: Publish packages
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.execute_publish)
        run: bash tool/release/publish_pub_packages.sh --execute --skip-existing

      - name: Trigger MCP Registry publication
        if: >-
          startsWith(github.ref, 'refs/tags/v') && (
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && inputs.trigger_mcp_registry)
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish_mcp_registry.yml --ref main -f release_tag="${GITHUB_REF_NAME}"
