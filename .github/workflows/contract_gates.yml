name: Contract Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests-and-coverage:
    name: Tests & coverage (gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install mcp_server_dart dependencies
        working-directory: mcp_server_dart
        run: flutter pub get

      - name: Run mcp_server_dart tests with coverage
        working-directory: mcp_server_dart
        env:
          HOME: /tmp
          DART_SUPPRESS_ANALYTICS: 'true'
        run: |
          dart pub global activate coverage
          dart pub global run coverage:test_with_coverage --branch-coverage

      - name: Provision oka test pin (provisional; unmerged PR #18)
        if: hashFiles('tool/ci/oka_consumer_pin.txt') != ''
        run: |
          bash tool/ci/provision_oka_consumer_test_pin.sh
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: flutter_mcp_harness analyze and unit tests
        run: |
          flutter pub get
          dart analyze packages/harness
          cd packages/harness && dart test --exclude-tags native-android,native-linux,compile-repro-opt-in

      - name: native_layer_capture_fixture analyze and widget tests
        run: |
          cd showcase/native_layer_capture_fixture
          flutter pub get
          dart analyze .
          flutter test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: mcp_server_dart/coverage/lcov.info
          flags: mcp_server_dart
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  informational:
    name: Contracts & analysis (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install mcp_server_dart dependencies
        working-directory: mcp_server_dart
        run: flutter pub get

      - name: Analyze flutter_live_edit packages
        continue-on-error: true
        run: |
          set -uo pipefail
          for pkg in \
            flutter_live_edit/flutter_live_edit_core \
            flutter_live_edit/flutter_live_edit_agent \
            flutter_live_edit/flutter_live_edit_toolkit \
            flutter_live_edit/live_edit_tooling_ui_kit \
            flutter_live_edit/live_edit_tooling_ui_kit_playground
          do
            if [[ ! -f "$pkg/pubspec.yaml" ]]; then
              echo "== skip $pkg (pubspec.yaml missing) =="
              continue
            fi
            echo "== analyze $pkg =="
            (cd "$pkg" && flutter pub get) || true
            dart analyze "$pkg" || true
          done

      - name: Live edit toolkit import boundary test
        continue-on-error: true
        if: ${{ hashFiles('flutter_live_edit/flutter_live_edit_toolkit/test/agent_import_boundary_test.dart') != '' }}
        working-directory: flutter_live_edit/flutter_live_edit_toolkit
        run: flutter test test/agent_import_boundary_test.dart

      - name: Check docs/help drift
        continue-on-error: true
        run: bash tool/contracts/check_docs_drift.sh

      - name: Check SDK parity
        continue-on-error: true
        run: bash tool/contracts/check_sdk_parity.sh

      - name: Check plugin surfaces
        continue-on-error: true
        run: bash tool/contracts/check_plugin_surfaces.sh

      - name: Check Claude plugin manifest
        continue-on-error: true
        run: bash tool/contracts/check_claude_plugin_manifest.sh

      - name: Check version sync
        run: bash tool/contracts/check_version_sync.sh

      - name: Check tool prefix
        continue-on-error: true
        run: bash tool/contracts/check_tool_prefix.sh

      - name: Checkout IntentCall (delegation target for codegen sync)
        uses: actions/checkout@v4
        with:
          repository: Arenukvern/intentcall
          path: intentcall

      - name: intentcall platform codegen drift (flutter_test_app)
        env:
          INTENTCALL_ROOT: ${{ github.workspace }}/intentcall
        run: |
          cd mcp_server_dart && flutter pub get
          dart run bin/flutter_mcp_toolkit.dart codegen sync \
            --platform web,android,ios,macos,linux,windows \
            --project-dir ../showcase/flutter_test_app --check

  release-contracts:
    name: Release contracts (gating)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Checkout IntentCall (CLI delegation target)
        uses: actions/checkout@v4
        with:
          repository: Arenukvern/intentcall
          path: intentcall

      - name: Version touchpoints match the train
        run: bash tool/contracts/check_version_sync.sh

      - name: Release PR sync workflow guards
        run: bash tool/contracts/check_release_sync_workflows.sh

      - name: Skill asset sync idempotence (synthetic stale)
        run: bash tool/contracts/test_skill_asset_sync_idempotence.sh

      - name: Release workflow contract (tag + dispatch recovery)
        run: |
          bash tool/contracts/check_release_workflow.sh
          bash tool/contracts/test_resolve_release_tag.sh
          bash tool/contracts/test_release_recovery_flow.sh
          bash tool/contracts/test_publish_pub_packages_oidc.sh
          bash tool/contracts/test_publish_pub_packages_skip_existing.sh
          bash tool/contracts/test_oka_consumer_overrides_guard.sh
          bash tool/contracts/check_macos_release_shell_compat.sh
          bash tool/contracts/test_verify_release_tarball_architecture.sh

      - name: MCP Registry contracts (server.json, Dockerfile, publish workflow)
        run: |
          bash tool/contracts/test_mcp_registry_release_version.sh
          bash tool/contracts/test_mcp_registry_overlay_boundaries.sh
          bash tool/contracts/test_mcp_registry_overlay_from_guard.sh
          bash tool/contracts/test_mcp_registry_smoke_resolution.sh
          bash tool/contracts/check_mcp_registry.sh

      - name: IntentCall consumer policy (incl. published-package floors)
        env:
          INTENTCALL_ROOT: ${{ github.workspace }}/intentcall
        run: |
          bash tool/intentcall/check_no_path_deps.sh
          bash tool/contracts/check_intentcall_hosted_consumer.sh
