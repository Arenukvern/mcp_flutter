name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build assets for (e.g. v7.0.2)'
        required: true
        type: string

permissions:
  contents: read

env:
  TOOLING_CHECKOUT_PATH: _tooling
  RELEASE_SRC_PATH: release-src

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_sha: ${{ steps.release_sha.outputs.sha }}
    steps:
      - name: Checkout workflow tooling (trusted SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ${{ env.TOOLING_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Resolve release target
        id: resolve
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DISPATCH_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/resolve_release_tag.sh"

      - name: Checkout release source (immutable tag)
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.resolve.outputs.release_tag }}
          path: ${{ env.RELEASE_SRC_PATH }}
          fetch-depth: 1

      - id: release_sha
        name: Record and verify release commit SHA
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          tag_sha="$(git -C "${{ env.RELEASE_SRC_PATH }}" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_sha="$(git -C "${{ env.RELEASE_SRC_PATH }}" rev-parse "HEAD^{commit}")"
          if [[ "$tag_sha" != "$head_sha" ]]; then
            echo "::error::release-src HEAD ($head_sha) != tag^{commit} ($tag_sha)"
            exit 1
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Assert VERSION at release source matches tag
        env:
          RELEASE_ROOT: ${{ github.workspace }}/${{ env.RELEASE_SRC_PATH }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/assert_release_tag.sh" \
            "${{ steps.resolve.outputs.release_tag }}"

      - name: Verify GitHub release exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/assert_github_release_exists.sh" \
            "${{ steps.resolve.outputs.release_tag }}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: darwin-arm64
            runner: macos-15
          - triple: linux-x64
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout workflow tooling (trusted SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ${{ env.TOOLING_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Checkout release source (immutable tag)
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.release_tag }}
          path: ${{ env.RELEASE_SRC_PATH }}
          fetch-depth: 1

      - name: Verify release source SHA
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/verify_release_source_checkout.sh" \
            "${{ env.RELEASE_SRC_PATH }}" \
            "${{ needs.prepare.outputs.release_tag }}" \
            "${{ needs.prepare.outputs.release_sha }}"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install mcp_server_dart dependencies
        working-directory: ${{ env.RELEASE_SRC_PATH }}/mcp_server_dart
        run: flutter pub get

      - name: Check release version sync (release source)
        env:
          RELEASE_ROOT: ${{ github.workspace }}/${{ env.RELEASE_SRC_PATH }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/contracts/check_version_sync.sh"

      - name: Build release artifacts
        env:
          RELEASE_ROOT: ${{ github.workspace }}/${{ env.RELEASE_SRC_PATH }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/build_release_artifacts.sh" \
            --version "$VERSION" \
            --triple "${{ matrix.triple }}"

      - name: Verify tarball architecture (trusted tooling script)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive="${{ env.RELEASE_SRC_PATH }}/dist/release/flutter_mcp_${VERSION}_${{ matrix.triple }}.tar.gz"
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/verify_release_tarball_architecture.sh" \
            "$archive" "${{ matrix.triple }}"

      - name: Upload release tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.triple }}
          path: ${{ env.RELEASE_SRC_PATH }}/dist/release/flutter_mcp_${{ needs.prepare.outputs.version }}_${{ matrix.triple }}.tar.gz
          if-no-files-found: error

  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [prepare, build]
    timeout-minutes: 15

    steps:
      - name: Checkout workflow tooling (trusted SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ${{ env.TOOLING_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Download release tarballs
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist/release
          sha256sum *.tar.gz > checksums.txt

      - name: Guard against conflicting GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash "${{ env.TOOLING_CHECKOUT_PATH }}/tool/release/check_release_assets_conflict.sh" \
            "${{ needs.prepare.outputs.release_tag }}" \
            "${{ needs.prepare.outputs.version }}"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          files: |
            dist/release/*.tar.gz
            dist/release/checksums.txt
          fail_on_unmatched_files: true
