# dart_changesets release train (engine: Arenukvern/dart_changesets).
# The action assembles the version PR from pending intent files and, on the
# version-PR merge, pushes one tag per release and dispatches the per-tag
# publish runs. Replaces the release-please root train for pub packages.
name: dart_changesets

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # workflow_dispatch creation (the action starts publish runs via
  # `gh workflow run`) needs actions: write — without it a version-PR
  # merge pushes tags but fails to start the publish runs (proven live on
  # the engine repo 2026-11-21).
  actions: write

concurrency:
  group: dart-changesets-release
  cancel-in-progress: false

env:
  VERSION_BRANCH: changesets/version-packages
  RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The composite action uses github.token for version-PR git/gh pushes
      # (same limitation as the old release-please default). A follow-up sync
      # push uses RELEASE_PLEASE_TOKEN when set so pull_request workflows
      # (contract gates, Android/Linux proofs) run on the version PR head.
      - uses: Arenukvern/dart_changesets@v1
        with:
          # This repo's per-tag publish workflow (the action's default
          # `publish.yml` does not exist here).
          publish-workflow: dart_changesets_publish.yml
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync release touchpoints on version PR branch
        env:
          GH_TOKEN: ${{ env.RELEASE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "$VERSION_BRANCH" >/dev/null 2>&1; then
            echo "No version branch on remote; skipping touchpoint sync"
            exit 0
          fi
          git fetch origin "$VERSION_BRANCH"
          git checkout -B "$VERSION_BRANCH" "origin/$VERSION_BRANCH"
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' mcp_toolkit/pubspec.yaml | head -1)"
          [[ -n "$version" ]] || { echo "::error::mcp_toolkit pubspec has no version"; exit 1; }
          bash tool/release/sync_version.sh --version "$version"
          if git diff --quiet && git diff --cached --quiet; then
            echo "release version touchpoints already in sync on $VERSION_BRANCH"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync release version touchpoints"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$VERSION_BRANCH"