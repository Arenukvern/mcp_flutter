name: Publish MCP Registry server

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v7.1.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: mcp-registry-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_SRC_PATH: release-src

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must look like vX.Y.Z (got '$tag')."
            exit 1
          fi

      - name: Checkout workflow tooling (trusted SHA)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout release source (immutable tag)
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: ${{ env.RELEASE_SRC_PATH }}
          persist-credentials: false

      # Tag supplies server sources only; main keeps Dockerfile.registry + Flutter pin + contracts.
      # (overlay guard matches FROM lines only — not comment mentions of cirruslabs/flutter.)
      - name: Overlay tagged server sources onto main tooling
        env:
          TOOLING_ROOT: ${{ github.workspace }}
          RELEASE_SRC: ${{ github.workspace }}/${{ env.RELEASE_SRC_PATH }}
        run: bash tool/release/overlay_mcp_registry_tag_sources.sh

      - name: Resolve release version (tag tree)
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SRC: ${{ github.workspace }}/${{ env.RELEASE_SRC_PATH }}
        run: bash tool/release/resolve_mcp_registry_release_version.sh

      - name: Synchronize release metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash tool/release/sync_version.sh --version "$RELEASE_VERSION"

      - name: Verify MCP Registry contracts
        run: bash tool/contracts/check_mcp_registry.sh

      - name: Assert hosted-only resolution (no pubspec_overrides)
        run: bash tool/release/assert_mcp_registry_no_pubspec_overrides.sh

      # Fail-closed MCPB gate: registry versions are immutable, so a missing or
      # mismatched flutter-mcp-toolkit.mcpb on the release must abort before any
      # publish (for example, when the release runner never produced the bundle).
      - name: Download MCPB release asset and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p mcpb_release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir mcpb_release \
            --pattern 'flutter-mcp-toolkit.mcpb' \
            --pattern 'checksums.txt'
          ls -la mcpb_release

      - name: Assert MCPB release asset (fail-closed registry gate)
        id: mcpb_gate
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gate_out="$(bash tool/release/assert_mcp_registry_release_assets.sh \
            --tag "${{ inputs.release_tag }}" \
            --version "$RELEASE_VERSION" \
            --assets-dir mcpb_release)"
          echo "$gate_out"
          mcpb_sha="$(printf '%s\n' "$gate_out" | sed -n 's/^sha256=//p' | tail -1)"
          [[ -n "$mcpb_sha" ]] || { echo "::error::gate did not emit sha256="; exit 1; }
          echo "sha256=$mcpb_sha" >> "$GITHUB_OUTPUT"

      - name: Inject MCPB fileSha256 into server.json
        env:
          MCPB_SHA256: ${{ steps.mcpb_gate.outputs.sha256 }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          jq --arg sha "$MCPB_SHA256" \
            '(.packages[] | select(.registryType == "mcpb") | .fileSha256) = $sha' \
            mcp_server_dart/server.json > "$tmp"
          mv "$tmp" mcp_server_dart/server.json
          jq -e '.packages[] | select(.registryType == "mcpb") | .fileSha256' \
            mcp_server_dart/server.json >/dev/null

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp_server_dart/Dockerfile.registry
          push: true
          platforms: linux/amd64
          tags: ghcr.io/arenukvern/flutter-mcp-toolkit:${{ steps.version.outputs.version }}

      - name: Install pinned mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict -
          tar xz mcp-publisher -f mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Validate server manifest with the Registry
        run: ./mcp-publisher validate mcp_server_dart/server.json

      - name: Authenticate to MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata to MCP Registry
        working-directory: mcp_server_dart
        run: ../mcp-publisher publish
