name: Regenerate CLI GIFs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/assets/gifs/**'
      - '.github/workflows/regenerate_cli_gifs.yml'

permissions:
  contents: read

jobs:
  vhs-gifs:
    name: vhs CLI/harness GIFs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: regenerate-cli-gifs-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install ttyd, ffmpeg, Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y -qq ttyd ffmpeg xvfb x11-utils

      - name: Install vhs
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/vhs.deb \
            https://github.com/charmbracelet/vhs/releases/download/v0.12.1/vhs_0.12.1_amd64.deb
          sudo dpkg -i /tmp/vhs.deb

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Checkout intentcall (showcase path deps)
        env:
          # Repo pin is behind mcp_toolkit's floor; GIF proof needs a compatible train.
          INTENTCALL_REF: main
        run: |
          set -euo pipefail
          bash tool/ci/checkout_intentcall.sh
          ln -snf "$(pwd)/intentcall" "$(dirname "$(pwd)")/intentcall"
          test -d ../intentcall/packages/intentcall_webmcp

      - name: Regenerate GIFs
        env:
          DISPLAY: ':99'
          INTENTCALL_REF: main
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          dart run docs/assets/gifs/regenerate.dart

      - name: Upload GIFs artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-harness-gifs
          path: docs/assets/gifs/*.gif