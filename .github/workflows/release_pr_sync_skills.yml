# Regenerates the release surfaces (skill_assets.g.dart bundle + docs/reference)
# on release version PRs and pushes when plugin manifests or the CLI surface
# drift from the committed artifacts. Matches both trains: release-please
# (`release-please--*`) and dart_changesets (`changesets/version-packages`,
# "chore: version packages").
name: Release PR — sync release surfaces

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: release-pr-automation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  detect-release-pr:
    runs-on: ubuntu-latest
    outputs:
      is_release_pr: ${{ steps.check.outputs.is_release_pr }}
    steps:
      - id: check
        name: Detect release version PR (release-please or dart_changesets)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.head_ref }}
        run: |
          title="$PR_TITLE"
          head="$PR_HEAD"
          if [[ "$head" == release-please--* ]] || \
             [[ "$head" == "changesets/version-packages" ]] || \
             [[ "$title" == *": release "* ]] || \
             [[ "$title" == "chore: version packages" ]]; then
            echo "is_release_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_pr=false" >> "$GITHUB_OUTPUT"
          fi

  auto-sync-skills:
    needs: detect-release-pr
    if: needs.detect-release-pr.outputs.is_release_pr == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'

      - name: Install deps
        run: cd mcp_server_dart && dart pub get

      - name: Regenerate skill assets
        run: dart run mcp_server_dart/tool/build_skill_assets.dart

      - name: Regenerate docs reference (best effort pre-publish)
        run: |
          if make docs-reference; then
            echo "docs/reference regenerated"
          else
            echo "::warning::docs-reference generation failed — hosted deps for the new train are not on pub.dev yet; regen_surfaces picks this up post-publish"
          fi

      - name: Commit and push if changed
        id: sync_commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          # status --porcelain (not git diff): a NEWLY generated reference
          # file is untracked and git diff alone would miss it.
          if ! git status --porcelain -- mcp_server_dart/lib/src/skill_assets.g.dart docs/reference | grep -q .; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "release surfaces already in sync"
            exit 0
          fi
          if [[ ! "$HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::unexpected HEAD_REF"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp_server_dart/lib/src/skill_assets.g.dart docs/reference
          git commit -m "chore: sync generated release surfaces for release PR"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify idempotence on PR head
        run: |
          dart run mcp_server_dart/tool/build_skill_assets.dart
          make docs-reference >/dev/null 2>&1 || true
          if git status --porcelain -- mcp_server_dart/lib/src/skill_assets.g.dart docs/reference | grep -q .; then
            echo "::error::generated release surfaces not idempotent after sync"
            exit 1
          fi

      - name: Publish skill-assets-post-sync status
        if: steps.sync_commit.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.sync_commit.outputs.head_sha }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'skill-assets-post-sync',
              description: 'skill_assets.g.dart regenerated and idempotent on this commit',
            });

  release-pr-checklist-comment:
    needs: detect-release-pr
    if: >-
      needs.detect-release-pr.outputs.is_release_pr == 'true' &&
      github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/release_pr_sync_skills.yml
        with:
          script: |
            const marker = '<!-- release-pr-skill-assets-checklist -->';
            const pr = context.payload.pull_request;
            const body = `${marker}
            ## Release PR — skill assets

            Release trains bump \`plugin/*-plugin/plugin.json\` and dependency constraints but not the generated \`skill_assets.g.dart\` bundle or \`docs/reference\`.

            **Automatic:** [Release PR — sync release surfaces](${process.env.WORKFLOW_URL}) commits both generated surfaces when drift is detected on this PR. If \`docs/reference\` could not be regenerated pre-publish (hosted deps not out yet), the post-merge **regen_surfaces** workflow opens a follow-up PR once the train lands on pub.dev.

            After a bot sync push, look for commit status **skill-assets-post-sync** on the latest head SHA, then re-run **skill-assets-drift** if required checks did not auto-fire.

            **Manual (if automation did not run):**
            \`\`\`bash
            make sync-skills
            git add mcp_server_dart/lib/src/skill_assets.g.dart
            git commit -m "chore: sync skill_assets.g.dart for release PR"
            git push
            \`\`\`

            **Required check:** \`skill-assets-drift\` must pass before merge.
            `;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
