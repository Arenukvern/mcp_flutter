name: showcase_drivers
description: >-
  Composition roots for the mcp_flutter showcase: drive the demo apps
  end-to-end through the harness and the universal automation family.
  This package owns the policy — the harness stays clean of pipeline
  dependencies (dependency inversion: composition wires, libraries don't).
publish_to: 'none'
version: 0.1.0

resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter_mcp_harness: ^0.1.0
  # Consumer boundary (docs/intentcall/README.md): no version — resolution
  # goes through the workspace root overrides pointing at ../intentcall.
  intentcall_core:
  path: ^1.9.0
  universal_screencast: ^0.1.0

dev_dependencies:
  lints: ^6.1.0
