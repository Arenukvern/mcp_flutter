name: flutter_demo
description: >-
  Showcase demo app for the Flutter MCP toolkit: a minimal instrumented
  target (routes, counter, text field) the harness drives end-to-end.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  mcp_toolkit:
    path: ../../mcp_toolkit

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
